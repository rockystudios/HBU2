<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Supabase Real-Time Chat</title>
  <!-- Load Supabase JS Client -->
  <script src="https://jsdelivr.net"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { display: flex; height: 100vh; background-color: #f4f4f9; color: #333; }
    
    /* Sidebar */
    #sidebar { width: 300px; background: #fff; border-right: 1px solid #ddd; display: flex; flex-direction: column; }
    #sidebar-header { padding: 16px; border-bottom: 1px solid #ddd; font-weight: bold; background: #f8f9fa; }
    #conversations-list { flex: 1; overflow-y: auto; }
    .conv-item { padding: 14px 16px; border-bottom: 1px solid #eee; cursor: pointer; transition: background 0.2s; }
    .conv-item:hover, .conv-item.active { background: #eef2ff; }
    
    /* Main Chat Area */
    #chat-container { flex: 1; display: flex; flex-direction: column; background: #fff; }
    #chat-header { padding: 16px; border-bottom: 1px solid #ddd; font-weight: bold; background: #f8f9fa; }
    #messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    
    /* Message Bubbles */
    .message { max-width: 70%; padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.4; position: relative; }
    .message.mine { align-self: flex-end; background: #4f46e5; color: white; border-bottom-right-radius: 2px; }
    .message.theirs { align-self: flex-start; background: #f1f5f9; color: #1e293b; border-bottom-left-radius: 2px; }
    
    /* Input Form */
    #input-area { display: flex; padding: 12px; border-top: 1px solid #ddd; gap: 10px; }
    #msg-input { flex: 1; padding: 10px 14px; border: 1px solid #ccc; border-radius: 20px; outline: none; }
    #send-btn { padding: 10px 20px; background: #4f46e5; color: white; border: none; border-radius: 20px; cursor: pointer; font-weight: bold; }
    #send-btn:hover { background: #4338ca; }
  </style>
</head>
<body>

  <!-- Left Sidebar -->
  <div id="sidebar">
    <div id="sidebar-header">Conversations</div>
    <div id="conversations-list">Loading chats...</div>
  </div>

  <!-- Right Chat Window -->
  <div id="chat-container">
    <div id="chat-header">Select a conversation</div>
    <div id="messages"></div>
    <form id="input-area">
      <input type="text" id="msg-input" placeholder="Type a message..." required autocomplete="off" />
      <button type="submit" id="send-btn">Send</button>
    </form>
  </div>
  <script>
    // 1. Your Credentials & Client Init
    const SB_CHAT_URL = 'https://kpdnoxmnycrtbklvuluu.supabase.co';
    const SB_CHAT_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtwZG5veG1ueWNydGJrbHZ1bHV1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMyMTY3NjIsImV4cCI6MjEwODc5Mjc2Mn0.6wukT9y083X1Br89EKmB0iKgAWrhpgHcZJDxuGrYYtY';
    const sb = window.supabase.createClient(SB_CHAT_URL, SB_CHAT_ANON_KEY);

    // 2. App State & DOM Elements
    let myId = null;
    let activeConv = null;
    let messages = [];
    let realtimeChannel = null;

    const messagesEl = document.getElementById('messages');
    const convListEl = document.getElementById('conversations-list');
    const chatHeaderEl = document.getElementById('chat-header');
    const msgForm = document.getElementById('input-area');
    const msgInput = document.getElementById('msg-input');

    // Simple Sound Effect Helper
    const SoundFX = {
      notify: () => {
        try {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          const osc = ctx.createOscillator();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(520, ctx.currentTime);
          osc.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.1);
        } catch (e) { /* Ignore if browser blocks autoplay audio */ }
      }
    };

    // 3. Your Exact Realtime Listener
    function setupRealtimeListener() {
      if (realtimeChannel) {
        sb.removeChannel(realtimeChannel);
      }
      realtimeChannel = sb.channel('chat-sync-' + myId)
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, (payload) => {
          const msg = payload.new;
          if (activeConv && msg.conversation_id === activeConv.id) {
            if (!messages.some(m => m.id === msg.id)) {
              messages.push(msg);
              appendMessageDOM(msg);
              if (msg.sender_id !== myId) SoundFX.notify();
            }
          }
          // Update sidebar previews
          loadConversationsList();
        })
        .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'messages' }, (payload) => {
          const oldMsg = payload.old;
          if (oldMsg && oldMsg.id) {
            messages = messages.filter(m => m.id !== oldMsg.id);
            const row = messagesEl.querySelector(`[data-msg-id="${oldMsg.id}"]`);
            if (row) row.remove();
          }
        })
        .on('postgres_changes', { event: '*', schema: 'public', table: 'conversation_members' }, () => {
          loadConversationsList();
        })
        .on('postgres_changes', { event: '*', schema: 'public', table: 'conversations' }, () => {
          loadConversationsList();
        })
        .subscribe();
    }
    // 4. UI & Database Functions
    function appendMessageDOM(msg) {
      const div = document.createElement('div');
      div.className = 'message ' + (msg.sender_id === myId ? 'mine' : 'theirs');
      div.setAttribute('data-msg-id', msg.id);
      // Note: Change 'msg.content' below if your text column has a different name
      div.textContent = msg.content || msg.text || msg.body || '[Empty Message]';
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    async function loadConversationsList() {
      // Fetches conversations; adjust select() if you join conversation_members
      const { data, error } = await sb
        .from('conversations')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) {
        console.error('Error loading conversations:', error);
        return;
      }

      convListEl.innerHTML = '';
      data.forEach(conv => {
        const div = document.createElement('div');
        div.className = 'conv-item' + (activeConv && activeConv.id === conv.id ? ' active' : '');
        div.textContent = conv.name || conv.title || `Chat #${conv.id.slice(0, 6)}`;
        div.onclick = () => selectConversation(conv);
        convListEl.appendChild(div);
      });
    }

    async function selectConversation(conv) {
      activeConv = conv;
      chatHeaderEl.textContent = conv.name || conv.title || `Chat #${conv.id}`;
      messagesEl.innerHTML = '';
      loadConversationsList(); // Refresh active highlight

      const { data, error } = await sb
        .from('messages')
        .select('*')
        .eq('conversation_id', conv.id)
        .order('created_at', { ascending: true });

      if (!error && data) {
        messages = data;
        messages.forEach(appendMessageDOM);
      }
    }

    // Handle Sending a Message
    msgForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = msgInput.value.trim();
      if (!text || !activeConv) return;

      msgInput.value = '';
      const { error } = await sb.from('messages').insert([{
        conversation_id: activeConv.id,
        sender_id: myId,
        content: text // Change 'content' if your column is named differently
      }]);

      if (error) console.error('Failed to send:', error);
    });

    // 5. Initialize App
    async function initApp() {
      const { data: { user } } = await sb.auth.getUser();
      // Uses logged-in user ID, or falls back to a temporary guest ID for testing
      myId = user ? user.id : 'guest-' + Math.floor(Math.random() * 10000);
      
      await loadConversationsList();
      setupRealtimeListener();
    }

    initApp();
  </script>
</body>
</html>

name: Deploy HBU2 Supabase Edge Function

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy send-message Edge Function
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy send-message
        run: supabase functions deploy send-message --project-ref "$SUPABASE_PROJECT_REF" --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: xvkjvuxhawlljakfkllu

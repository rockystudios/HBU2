name: Deploy HBU2 Supabase Edge Function

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/send-message/**"
      - "supabase/functions/hbu-gateway/**"
      - ".github/workflows/deploy-hbu2-edge-function.yml"

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy HBU2 Edge Functions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: xvkjvuxhawlljakfkllu
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.58.5

      - name: Deploy send-message
        run: supabase functions deploy send-message --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt --yes
      - name: Deploy hbu-gateway
        run: supabase functions deploy hbu-gateway --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt --yes

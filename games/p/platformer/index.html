<title>Neon Pulse Platformer & Level Maker</title>
<style>

    border: 1px solid #2d3759;

  .controls-bar { display: flex; gap: 8px; }

    color: white;
    border: none;
    padding: 7px 14px;
    border-radius: 6px;
    font-weight: 600;

    font-size: 0.85rem;
  }
  button:hover { background: #1d4ed8; transform: translateY(-1px); }
  button:active { transform: translateY(0); }
  button.secondary { background: #334155; }
  button.secondary:hover { background: #475569; }
  button.success { background: #059669; }
  button.success:hover { background: #047857; }
  button.danger { background: #dc2626; }
  button.danger:hover { background: #b91c1c; }
  button.active-tool { outline: 2px solid #38bdf8; background: #1e40af; }

  #game-wrapper {

    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
    border: 2px solid #2d3759;

  .swatch { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }

    height: 54px;

    color: #38bdf8;
    border: 1px solid #334155;
    border-radius: 6px;
    padding: 8px;
    font-family: monospace;
    font-size: 0.8rem;
    resize: none;

  .hint { font-size: 0.8rem; color: #94a3b8; margin-top: 6px; }

</head>

<header>

// Simple Web Audio Synthesizer (No external files needed)
const AudioCtx = window.AudioContext || window.webkitAudioContext;
const actx = new AudioCtx();
function playSound(freq, type, duration, vol = 0.12) {
  if (actx.state === 'suspended') actx.resume();
  const osc = actx.createOscillator();
  const gain = actx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, actx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(freq * 0.5, actx.currentTime + duration);
  gain.gain.setValueAtTime(vol, actx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + duration);
  osc.connect(gain);
  gain.connect(actx.destination);
  osc.start();
  osc.stop(actx.currentTime + duration);
}

function cloneGrid(g) {
  return g.map(row => [...row]);
}
 
function handlePortals() {
  if (portalCooldown > 0) { portalCooldown--; return; }
  if (!portals.orange || !portals.blue) return;
  if (rectOverlap(player.x, player.y, player.w, player.h,
                 portals.orange.c * TILE + 8, portals.orange.r * TILE + 8, TILE - 16, TILE - 16)) {
    const dx = (player.x + player.w / 2) - (portals.orange.c * TILE + TILE / 2);
    const dy = (player.y + player.h / 2) - (portals.orange.r * TILE + TILE / 2);
    player.x = portals.blue.c * TILE + TILE / 2 + dx - player.w / 2;
    player.y = portals.blue.r * TILE + TILE / 2 + dy - player.h / 2;
    player.vy = 0; portalCooldown = 15;
    playSound(520, 'sine', 0.15);
    spawnParticles(portals.orange.c * TILE + TILE / 2, portals.orange.r * TILE + TILE / 2, '#f97316', 14);
  } else if (rectOverlap(player.x, player.y, player.w, player.h,
                 portals.blue.c * TILE + 8, portals.blue.r * TILE + 8, TILE - 16, TILE - 16)) {
    // mirror: blue -> orange (swap orange/blue in the above)
  }
}
 
function loadLevel(level) {
  grid = cloneGrid(level.grid);
  portals = JSON.parse(JSON.stringify(level.portals || { orange: null, blue: null }));
  currentLevel = level;
  portalCooldown = 0;
  coins = [];
  movingPlatforms = [];
  particles = [];
  player.vx = 0;
  player.vy = 0;
  player.speedBoostTimer = 0;
  player.trail = [];

  let foundSpawn = false;
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const val = grid[r][c];
      if (val === 8) {
        player.x = c * TILE + 4;
        player.y = r * TILE + 2;
        foundSpawn = true;
      } else if (val === 5) {
        coins.push({ x: c * TILE + TILE / 2, y: r * TILE + TILE / 2, collected: false });
      } else if (val === 7) {
        movingPlatforms.push({
          startX: c * TILE, x: c * TILE, y: r * TILE,
          w: TILE * 2, h: 14, dir: 1, range: 90, speed: 1.8
        });
      }
    }
  }
  if (!foundSpawn) { player.x = 60; player.y = 60; }
  updateHUD();
}

function updateHUD() {
  const collected = coins.filter(c => c.collected).length;
  document.getElementById('ui-coins').textContent = `${collected}/${coins.length}`;
  document.getElementById('ui-deaths').textContent = deaths;
  document.getElementById('ui-level').textContent = isEditor ? "Editor" : (currentLevelIdx + 1);
}

function spawnParticles(x, y, color, count = 12) {
  for (let i = 0; i < count; i++) {
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * 7,
      vy: (Math.random() - 0.5) * 7,
      life: 1,
      color
    });
  }
}

function jump() {
  if (player.grounded || player.jumpsLeft > 0) {
    player.vy = player.jumpForce;
    if (!player.grounded) spawnParticles(player.x + player.w / 2, player.y + player.h, '#38bdf8', 8);
    player.grounded = false;
    player.jumpsLeft--;
    playSound(320, 'sine', 0.15);
  }
}

function killPlayer() {
  deaths++;
  playSound(120, 'sawtooth', 0.3, 0.2);
  spawnParticles(player.x + player.w / 2, player.y + player.h / 2, '#ef4444', 25);
  loadLevel(grid);
}

function hasAtLeastHalfCoins(collected, coins) {
  if (!coins || coins.length === 0) return true; // no coins required
  return collected / coins.length >= 0.5;
}
 // 1378


function rectOverlap(ax, ay, aw, ah, bx, by, bw, bh) {
  return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
}

function teleportTo(from, to) {
  const dx = (player.x + player.w / 2) - (from.c * TILE + TILE / 2);
  const dy = (player.y + player.h / 2) - (from.r * TILE + TILE / 2);
  player.x = to.c * TILE + TILE / 2 + dx - player.w / 2;
  player.y = to.r * TILE + TILE / 2 + dy - player.h / 2;
  player.vy = 0;
  portalCooldown = 15;
  playSound(520, 'sine', 0.15);
  spawnParticles(from.c * TILE + TILE / 2, from.r * TILE + TILE / 2, '#f97316', 14);
}

function handlePortals() {
  if (portalCooldown > 0) { portalCooldown--; return; }
  if (!portals.orange || !portals.blue) return;
  if (rectOverlap(player.x, player.y, player.w, player.h,
                 portals.orange.c * TILE + 8, portals.orange.r * TILE + 8, TILE - 16, TILE - 16)) {
    teleportTo(portals.orange, portals.blue);
  } else if (rectOverlap(player.x, player.y, player.w, player.h,
                 portals.blue.c * TILE + 8, portals.blue.r * TILE + 8, TILE - 16, TILE - 16)) {
    teleportTo(portals.blue, portals.orange);
  }
}

function update() {
  frameCount++;
  if (isEditor) return;

  // Horizontal movement
  let moveDir = 0;
  if (keys['ArrowLeft'] || keys['KeyA']) moveDir -= 1;
  if (keys['ArrowRight'] || keys['KeyD']) moveDir += 1;

  if (player.speedBoostTimer > 0) player.speedBoostTimer--;
  const maxSpeed = player.speedBoostTimer > 0 ? player.speed * 1.75 : player.speed;
  player.vx = moveDir * maxSpeed;

  // Gravity
  player.vy += 0.52;
  if (player.vy > 13) player.vy = 13;

  // Moving platforms update
  for (const mp of movingPlatforms) {
    mp.x += mp.speed * mp.dir;
    if (Math.abs(mp.x - mp.startX) >= mp.range) mp.dir *= -1;
  }

  // Move X & resolve solid tiles
  player.x += player.vx;
  resolveTileCollisions(true);

  // Move Y & resolve solid tiles
  player.grounded = false;
  player.y += player.vy;
  resolveTileCollisions(false);
  handlePortals();

  // Moving platform landing
  for (const mp of movingPlatforms) {
    if (player.vy >= 0 &&
        player.x + player.w > mp.x && player.x < mp.x + mp.w &&
        player.y + player.h >= mp.y && player.y + player.h <= mp.y + mp.h + 10) {
      player.y = mp.y - player.h;
      player.vy = 0;
      player.grounded = true;
      player.jumpsLeft = 2;
      player.x += mp.speed * mp.dir;
    }
  }

  // Trail effect
  if (frameCount % 2 === 0) {
    player.trail.push({ x: player.x, y: player.y, alpha: 0.5 });
    if (player.trail.length > 8) player.trail.shift();
  }

  // Coin collection
  for (const c of coins) {
    if (!c.collected && rectOverlap(player.x, player.y, player.w, player.h, c.x - 8, c.y - 8, 16, 16)) {
      c.collected = true;
      playSound(780, 'triangle', 0.14);
      spawnParticles(c.x, c.y, '#f59e0b', 10);
      updateHUD();
    }
  }

  // Out of bounds
  if (player.y > canvas.height + 40) killPlayer();

  // Update particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.life -= 0.04;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function resolveTileCollisions(horizontal) {
  const laserActive = Math.floor(frameCount / 75) % 2 === 0;
  const leftCol = Math.max(0, Math.floor(player.x / TILE));
  const rightCol = Math.min(COLS - 1, Math.floor((player.x + player.w - 0.01) / TILE));
  const topRow = Math.max(0, Math.floor(player.y / TILE));
  const botRow = Math.min(ROWS - 1, Math.floor((player.y + player.h - 0.01) / TILE));

  for (let r = topRow; r <= botRow; r++) {
    for (let c = leftCol; c <= rightCol; c++) {
      const tile = grid[r][c];
      const tx = c * TILE;
      const ty = r * TILE;

      if (tile === 1) { // Solid block
        if (horizontal) {
          if (player.vx > 0) player.x = tx - player.w;
          else if (player.vx < 0) player.x = tx + TILE;
          player.vx = 0;
        } else {
          if (player.vy > 0) {
            player.y = ty - player.h;
            player.grounded = true;
            player.jumpsLeft = 2;
          } else if (player.vy < 0) {
            player.y = ty + TILE;
          }
          player.vy = 0;
        }
      } else if (tile === 2) { // Jump Boost Pad
        if (rectOverlap(player.x, player.y, player.w, player.h, tx + 2, ty + 14, TILE - 4, 16)) {
          player.vy = -16.5;
          player.grounded = false;
          player.jumpsLeft = 2;
          playSound(520, 'sine', 0.25);
          spawnParticles(tx + TILE / 2, ty + 16, '#10b981', 15);
        }
      } else if (tile === 3) { // Spikes
        if (rectOverlap(player.x, player.y, player.w, player.h, tx + 5, ty + 10, TILE - 10, TILE - 10)) {
          killPlayer();
          return true;
        }
      } else if (tile === 4 && laserActive) { // Pulsing Laser
        if (rectOverlap(player.x, player.y, player.w, player.h, tx + 11, ty, 8, TILE)) {
          killPlayer();
          return true;
        }
      } else if (tile === 6) { // Speed Boost Pad
        if (rectOverlap(player.x, player.y, player.w, player.h, tx, ty + 18, TILE, 12)) {
          player.speedBoostTimer = 90;
          playSound(640, 'square', 0.12, 0.08);
          spawnParticles(player.x + player.w / 2, player.y + player.h, '#a855f7', 5);
        }
        } else if (tile === 9) { // Goal Portal
            if (rectOverlap(player.x, player.y, player.w, player.h, tx + 4, ty + 4, TILE - 8, TILE - 8)) {
              playSound(880, 'sine', 0.4);
              spawnParticles(tx + TILE / 2, ty + TILE / 2, '#fde047', 30);
          
              if (isEditor) {
                // No progression while editing — just flash the portal.
                toggleEditor(true);
              } else {
                const collected = coins.filter(c => c.collected).length;
                if (!hasAtLeastHalfCoins(collected, coins)) {
                  killPlayer();               // not enough coins — back to spawn
                } else {
                  currentLevelIdx = (currentLevelIdx + 1) % BUILTIN_LEVELS.length;
                  loadLevel(BUILTIN_LEVELS[currentLevelIdx]);
                }
              }
           return true;
         }
       }
    }
  }
  return false;
}
 
function drawPortal(p, color) {
  const x = p.c * TILE + TILE / 2;
  const y = p.r * TILE + TILE / 2;
  const pulse = 8 + Math.sin(frameCount * 0.12) * 2;
  ctx.strokeStyle = color;
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(x + 2, y, pulse, 0, Math.PI * 2);
  ctx.stroke();
  ctx.fillStyle = color;
  ctx.globalAlpha = 0.3;
  ctx.beginPath();
  ctx.arc(x + 2, y, pulse * 0.6, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalAlpha = 1;
  ctx.lineWidth = 1;
}

function draw() {
  ctx.fillStyle = '#0b0e17';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Subtle background grid
  ctx.strokeStyle = isEditor ? '#1e293b' : '#111626';
  ctx.lineWidth = 1;
  for (let x = 0; x <= canvas.width; x += TILE) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
  }
  for (let y = 0; y <= canvas.height; y += TILE) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
  }

  if (portals.orange) drawPortal(portals.orange, '#f97316');
  if (portals.blue)   drawPortal(portals.blue,   '#60a5fa');
  }

  const laserActive = Math.floor(frameCount / 75) % 2 === 0;

  // Draw Grid Tiles
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const tile = grid[r][c];
      const x = c * TILE;
      const y = r * TILE;

      if (tile === 1) {
        ctx.fillStyle = '#1e3a8a';
        ctx.fillRect(x, y, TILE, TILE);
        ctx.strokeStyle = '#3b82f6';
        ctx.strokeRect(x + 1, y + 1, TILE - 2, TILE - 2);
      } else if (tile === 2) {
        ctx.fillStyle = '#10b981';
        ctx.fillRect(x + 2, y + 18, TILE - 4, 12);
        ctx.fillStyle = '#6ee7b7';
        ctx.fillRect(x + 5, y + 14, TILE - 10, 4);
      } else if (tile === 3) {
        ctx.fillStyle = '#ef4444';
        ctx.beginPath();
        ctx.moveTo(x + 2, y + TILE);
        ctx.lineTo(x + TILE / 2, y + 6);
        ctx.lineTo(x + TILE - 2, y + TILE);
        ctx.fill();
      } else if (tile === 4) {
        ctx.fillStyle = '#475569';
        ctx.fillRect(x + 8, y, 14, 4);
        ctx.fillRect(x + 8, y + TILE - 4, 14, 4);
        if (laserActive || isEditor) {
          ctx.fillStyle = laserActive ? '#f43f5e' : 'rgba(244, 63, 94, 0.25)';
          ctx.fillRect(x + 12, y + 4, 6, TILE - 8);
        }
      } else if (tile === 5 && isEditor) {
        ctx.fillStyle = '#f59e0b';
        ctx.beginPath(); ctx.arc(x + 15, y + 15, 7, 0, Math.PI * 2); ctx.fill();
      } else if (tile === 6) {
        ctx.fillStyle = '#a855f7';
        ctx.fillRect(x, y + 22, TILE, 8);
      } else if (tile === 7 && isEditor) {
        ctx.fillStyle = '#06b6d4';
        ctx.fillRect(x, y, TILE * 2, 14);
      } else if (tile === 8 && isEditor) {
        ctx.strokeStyle = '#ffffff';
        ctx.strokeRect(x + 4, y + 2, 22, 26);
      } else if (tile === 9) {
        ctx.strokeStyle = '#fde047';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(x + 15, y + 15, 10 + Math.sin(frameCount * 0.1) * 2, 0, Math.PI * 2);
        ctx.stroke();
        ctx.lineWidth = 1;
      }
    }
  }

  if (!isEditor) {
    // Active Coins
    for (const c of coins) {
      if (c.collected) continue;
      ctx.fillStyle = '#f59e0b';
      ctx.beginPath();
      ctx.arc(c.x, c.y + Math.sin(frameCount * 0.1) * 3, 7, 0, Math.PI * 2);
      ctx.fill();
    }

    // Active Moving Platforms
    ctx.fillStyle = '#06b6d4';
    for (const mp of movingPlatforms) {
      ctx.fillRect(mp.x, mp.y, mp.w, mp.h);
    }

    // Player Trail & Body
    for (const t of player.trail) {
      ctx.fillStyle = player.speedBoostTimer > 0 ? 'rgba(168, 85, 247, 0.25)' : 'rgba(56, 189, 248, 0.2)';
      ctx.fillRect(t.x, t.y, player.w, player.h);
    }
    ctx.fillStyle = player.speedBoostTimer > 0 ? '#d8b4fe' : '#38bdf8';
    ctx.fillRect(player.x, player.y, player.w, player.h);
    ctx.fillStyle = '#0f172a';
    ctx.fillRect(player.x + (player.vx >= 0 ? 13 : 4), player.y + 6, 5, 5);

    // Particles
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
    }
    ctx.globalAlpha = 1;
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

// --- Level Editor & JSON Controls ---
const btnMode = document.getElementById('btn-mode');
const editorPanel = document.getElementById('editor-panel');
const jsonBox = document.getElementById('json-box');

function toggleEditor(forceState) {
  isEditor = typeof forceState === 'boolean' ? forceState : !isEditor;
  editorPanel.classList.toggle('visible', isEditor);
  btnMode.textContent = isEditor ? 'Play Custom Level' : 'Open Level Maker';
  btnMode.className = isEditor ? 'success' : 'secondary';
  if (!isEditor) loadLevel({ grid, portals });
  updateHUD();
}

btnMode.addEventListener('click', () => toggleEditor());
document.getElementById('btn-reset').addEventListener('click', () => loadLevel(currentLevel));
document.getElementById('btn-next').addEventListener('click', () => {
  if (isEditor) toggleEditor(false);
  currentLevelIdx = (currentLevelIdx + 1) % BUILTIN_LEVELS.length;
  loadLevel(BUILTIN_LEVELS[currentLevelIdx]);
});

document.querySelectorAll('.tool-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active-tool'));
    btn.classList.add('active-tool');
    selectedTile = Number(btn.dataset.tile);
  });
});

document.getElementById('btn-clear-map').addEventListener('click', () => {
  grid = Array.from({ length: ROWS }, (_, r) =>
    Array.from({ length: COLS }, (_, c) => (r === 0 || r === ROWS - 1 || c === 0 || c === COLS - 1 ? 1 : 0))
  );
  portals = { orange: null, blue: null };
});
function clearPortalAt(r, c) {
  if (portals.orange && portals.orange.r === r && portals.orange.c === c) portals.orange = null;
  if (portals.blue && portals.blue.r === r && portals.blue.c === c) portals.blue = null;
}

function paintTile(e) {
  if (!isEditor) return;
  const rect = canvas.getBoundingClientRect();
  const c = Math.floor((e.clientX - rect.left) / TILE);
  const r = Math.floor((e.clientY - rect.top) / TILE);
  if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return;

  const tileToPlace = mouseButton === 2 ? 0 : selectedTile;

  if (tileToPlace === 0) { clearPortalAt(r, c); grid[r][c] = 0; return; }
  if (tileToPlace === 10) { portals.orange = { r, c }; grid[r][c] = 0; return; }
  if (tileToPlace === 11) { portals.blue = { r, c }; grid[r][c] = 0; return; }
  clearPortalAt(r, c);

  if (tileToPlace === 8) {
    for (let rr = 0; rr < ROWS; rr++)
      for (let cc = 0; cc < COLS; cc++)
        if (grid[rr][cc] === 8) grid[rr][cc] = 0;
  }
  grid[r][c] = tileToPlace;
}
 
 

canvas.addEventListener('contextmenu', e => e.preventDefault());
canvas.addEventListener('mousedown', e => { isMouseDown = true; mouseButton = e.button; paintTile(e); });
canvas.addEventListener('mousemove', e => { if (isMouseDown) paintTile(e); });
window.addEventListener('mouseup', () => isMouseDown = false);

document.getElementById('btn-export').addEventListener('click', () => {
  const levelName = prompt("Enter a name for this level:", "HBU") || "CustomLevel";
  const stringRows = grid.map(row => `    "${row.join("")}"`).join(",\n");

  const payload = `{\n  name: ${JSON.stringify(levelName)},\n  portals: ${JSON.stringify(portals)},\n  grid: [\n${stringRows}\n  ].map(r => r.split("").map(Number))\n},`;

  jsonBox.value = payload;
  jsonBox.select();
  navigator.clipboard?.writeText(payload);
});


document.getElementById('btn-import').addEventListener('click', () => {
  try {
    let raw = jsonBox.value.trim();

    raw = raw.replace(/,\s*$/, '');
    raw = raw.replace(/\.map\s*$[\s\S]*?$\s*\}$/, '}');
    raw = raw.replace(/([{,]\s*)(name|portals|grid)\s*:/g, '$1"$2":');

    const parsed = JSON.parse(raw);

    if (!Array.isArray(parsed.grid) || parsed.grid.length !== ROWS) {
      throw new Error("Invalid grid");
    }

    grid = parsed.grid.map(row =>
      typeof row === "string" ? row.split("").map(Number) : row
    );
    portals = parsed.portals || { orange: null, blue: null };

    toggleEditor(false);
  } catch (err) {
    alert("Invalid level format! Make sure you pasted the complete level text.");
  }
});


// Start Game
loadLevel(BUILTIN_LEVELS[0]);
 
loop();
</script>
